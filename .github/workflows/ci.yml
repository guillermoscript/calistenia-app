name: CI Checks

on:
  workflow_call:

jobs:
  ci:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # "all workspaces" es literal desde #483: `pnpm -r` sólo ejecuta el script
      # en los paquetes que lo declaran, y `packages/core` no tenía ni script
      # `typecheck` ni `tsconfig.json`, así que se saltaba entero — su código
      # sólo se validaba de rebote desde web (strict:false) y móvil (strict).
      # Ahora entran los tres. Si alguien quita el script de core, esto vuelve a
      # pasar en silencio: el paso seguiría verde comprobando una cosa menos.
      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      # Web dejó de ser la excepción en el #484: ya tiene su propia flat config
      # (react-hooks). `-r` se salta los paquetes sin script `lint`, así que el
      # día que packages/core tenga uno entra solo.
      - name: Lint (mobile + web)
        run: pnpm -r lint

      - name: Unit tests (packages/core + mobile)
        run: pnpm -r test

      # La app vive en Play: siempre hay versiones viejas del cliente ahí fuera.
      # Una migración que borra un campo o cierra una regla no rompe ningún test
      # — rompe a quien no ha actualizado, en producción y a veces en silencio.
      - name: Schema contract (migraciones vs clientes instalados)
        run: node scripts/check-schema-contract.mjs

  # Smoke E2E del golden path (#145): signup → primera sesión de entrenamiento.
  # Corre contra un PocketBase efímero recién migrado (sin seeds — el flujo usa
  # los workouts de fallback) + el dev server de Vite que levanta Playwright.
  # Ambos workflows de deploy hacen `needs: [ci]` sobre este workflow reusable,
  # así que un smoke rojo bloquea el deploy de web y de AI-API.
  e2e-smoke:
    name: E2E smoke (signup → primera sesión)
    runs-on: ubuntu-latest
    env:
      PB_VERSION: 0.36.8 # mantener en sync con Dockerfile.pb-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cachear el binario evita depender de GitHub releases en cada run
      # (su CDN devuelve 504s intermitentes de vez en cuando).
      - name: Cache PocketBase binary
        id: pb-cache
        uses: actions/cache@v4
        with:
          path: /tmp/pb
          key: pocketbase-${{ env.PB_VERSION }}-linux-amd64

      - name: Download PocketBase
        if: steps.pb-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip" -o /tmp/pb.zip
          unzip -o /tmp/pb.zip -d /tmp/pb

      # Integration tests de pb_hooks (issue #144): levantan su PROPIO PB
      # efímero en un puerto libre — no interfieren con el PB del e2e de abajo.
      - name: PB hooks integration tests
        run: PB_BINARY=/tmp/pb/pocketbase node tests/pb_hooks/run.mjs

      - name: Start PocketBase (fresh data, migrations + hooks del repo)
        run: |
          /tmp/pb/pocketbase serve \
            --http=127.0.0.1:8090 \
            --dir=/tmp/pb_data \
            --migrationsDir=pb_migrations \
            --hooksDir=pb_hooks > /tmp/pb.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health && break
            [ "$i" = 30 ] && { echo 'PocketBase no arrancó'; cat /tmp/pb.log; exit 1; }
            sleep 1
          done

      # Seed determinista sobre la DB desechable: superuser efímero + programa
      # "Intermedio – Balance Total" (el smoke verifica que aparece en la UI).
      - name: Seed PocketBase
        run: |
          /tmp/pb/pocketbase superuser upsert e2e@ci.test E2eCiPass123! --dir=/tmp/pb_data
          node scripts/seed-program.mjs http://127.0.0.1:8090 e2e@ci.test E2eCiPass123!

      # Se testea el bundle real de producción (no el dev server): mismo output
      # minificado que se despliega, con el PB efímero baked como backend.
      # Detecta bugs que solo existen en build (p.ej. purge de Tailwind).
      - name: Build production bundle (apuntando al PB efímero)
        run: pnpm --filter @calistenia/web exec vite build
        env:
          VITE_POCKETBASE_URL: http://127.0.0.1:8090

      - name: Install Playwright Chromium
        run: pnpm --filter @calistenia/web exec playwright install --with-deps chromium

      - name: Run smoke test (contra vite preview del build)
        run: pnpm --filter @calistenia/web run test:e2e:smoke

      - name: Upload failure artifacts (screenshots + PB log)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure
          path: |
            apps/web/test-results/
            /tmp/pb.log
          if-no-files-found: ignore
          retention-days: 7
