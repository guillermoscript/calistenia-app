name: Build & Deploy AI API

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/build-ai-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # `mcp-server` NO está en el workspace de pnpm (pnpm-workspace.yaml solo lista
  # apps/* y packages/*): es un proyecto npm aparte, así que el `pnpm -r
  # typecheck` / `pnpm -r test` de ci.yml nunca lo tocaba. Sus tests existían
  # desde hacía meses sin que nadie los ejecutara (#298).
  ai-api-checks:
    name: Typecheck & test AI API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-ai-api:
    name: Build & push AI API
    runs-on: ubuntu-latest
    needs: [ci, ai-api-checks]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push AI API image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          build-args: |
            SERVER_URL=${{ vars.SERVER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy AI API
    runs-on: ubuntu-latest
    needs: [build-ai-api]
    if: github.event_name != 'pull_request'
    # Requires manual approval via the "production" environment (required reviewer).
    environment: production
    steps:
      - name: Trigger deploy
        run: |
          if [ -n "${{ secrets.DOKPLOY_AI_API_WEBHOOK_URL }}" ]; then
            curl -sSf -X POST "${{ secrets.DOKPLOY_AI_API_WEBHOOK_URL }}"
          fi
