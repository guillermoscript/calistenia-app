name: Build & Deploy AI API

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'packages/core/**'
      - '.github/workflows/build-ai-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'packages/core/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # `mcp-server` NO está en el workspace de pnpm (pnpm-workspace.yaml solo lista
  # apps/* y packages/*): es un proyecto npm aparte, así que el `pnpm -r
  # typecheck` / `pnpm -r test` de ci.yml nunca lo tocaba. Sus tests existían
  # desde hacía meses sin que nadie los ejecutara (#298).
  ai-api-checks:
    name: Typecheck & test AI API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `@calistenia/core` es un `file:../packages/core`, así que npm lo enlaza
      # con un symlink pero NO instala sus dependencias. Node resuelve por la
      # ruta REAL, de modo que un `import 'dayjs'` dentro de
      # packages/core/lib/*.ts busca en packages/core/node_modules → ausente
      # aquí (sólo el `pnpm install` de la raíz lo crea, y este job no lo
      # corre) → `mcp-use build` moría al evaluar la entrada (#517).
      #
      # Apuntamos las dependencias de core al árbol que acaba de instalar
      # `npm ci`. No es un apaño: el bundle de `mcp-use build` INLINEA el
      # código de core y deja los paquetes de terceros como imports externos
      # ("dayjs"), que en producción se resuelven contra
      # mcp-server/node_modules. O sea que todo lo que core necesite en runtime
      # tiene que estar declarado en mcp-server/package.json de todas formas
      # (dayjs y pocketbase ya lo están); esto sólo hace que el build falle
      # ruidosamente aquí en vez de en el arranque del contenedor.
      - name: Resolve core deps from the mcp-server tree
        run: test -e ../packages/core/node_modules || ln -s ../../mcp-server/node_modules ../packages/core/node_modules

      # Va ANTES del typecheck a propósito: `mcp-use build` bundlea las views
      # (Vite, sin tipar), valida el `view` ↔ `outputSchema` de cada tool al
      # evaluar la entrada, y genera `mcp-env.d.ts` — que es lo que da a
      # `tsconfig.views.json` los tipos reales de `useCallTool("…")`. Es la
      # misma orden que corre el Dockerfile.
      - name: Build server + views (mcp-use build)
        run: npm run build

      - name: Typecheck (src + views)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-ai-api:
    name: Build & push AI API
    runs-on: ubuntu-latest
    needs: [ci, ai-api-checks]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push AI API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mcp-server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          build-args: |
            SERVER_URL=${{ vars.SERVER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy AI API
    runs-on: ubuntu-latest
    needs: [build-ai-api]
    if: github.event_name != 'pull_request'
    # Requires manual approval via the "production" environment (required reviewer).
    environment: production
    steps:
      - name: Trigger deploy
        run: |
          if [ -n "${{ secrets.DOKPLOY_AI_API_WEBHOOK_URL }}" ]; then
            curl -sSf -X POST "${{ secrets.DOKPLOY_AI_API_WEBHOOK_URL }}"
          fi
