name: Build & Deploy App

# `programs/**` y `scripts/**` están en los `paths` de abajo porque ya pasó
# antes (#437): un PR que solo toca un directorio ausente de estos filtros se
# mezcla a main sin que ninguna máquina lo mire. `ci.yml` ya corre
# `programs:seed:check` y el guardarraíl de contenido de programas
# (`programs:content:check`), pero eso no sirve de nada si el propio `push`/
# `pull_request` de este workflow nunca dispara sobre un cambio en
# `programs/*.json` o en `scripts/check-program-content.mjs`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pb_migrations/**'
      - 'pb_hooks/**'
      - 'programs/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pb_migrations/**'
      - 'pb_hooks/**'
      - 'programs/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-app:
    name: Build & push App
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    outputs:
      sentry-release: ${{ steps.sentry.outputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `sentry-cli releases set-commits --auto` deriva los commits del árbol
          # de git local. Con el checkout somero de por defecto (fetch-depth: 1)
          # no ve historia y no asocia nada.
          fetch-depth: 0

      - name: Compute Sentry release
        id: sentry
        # `calistenia-app@<version>+<sha corto>`, mismo formato que móvil. La
        # versión da legibilidad en la UI de Sentry; el sha la hace única por
        # deploy, que es lo que hacía falta.
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          echo "release=calistenia-app@${VERSION}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_POCKETBASE_URL=${{ secrets.VITE_POCKETBASE_URL }}
            VITE_AI_API_URL=${{ secrets.VITE_AI_API_URL }}
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}
            SENTRY_RELEASE=${{ steps.sentry.outputs.release }}
          # Secret, no build-arg: un build-arg se queda en los metadatos de la
          # imagen y lo lee cualquiera con `docker history`.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Los source maps ya los subió sentryVitePlugin dentro del build, pero ese
      # build corre en Docker sin `.git`, así que los COMMITS de la release hay
      # que asociarlos desde aquí, donde sí está el checkout.
      #
      # Esto es lo que hace que `Fixes GYM-GUILLE-21` en un mensaje de commit
      # cierre el issue solo: Sentry solo lee ese keyword de los commits que
      # sabe que van en una release. Sin este paso el keyword no se lee nunca.
      #
      # --ignore-missing es OBLIGATORIO aquí: mergeamos con squash, así que los
      # SHA se reescriben y el commit de la release anterior puede no existir ya
      # en la historia. Sin la bandera, el comando falla.
      #
      # continue-on-error: la telemetría no puede tumbar un deploy.
      - name: Associate commits with the Sentry release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: guillermoscript
          SENTRY_PROJECT: gym-guille
          RELEASE: ${{ steps.sentry.outputs.release }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN no configurado — se omite la asociación de commits"
            exit 0
          fi
          npx --yes @sentry/cli@2.58.6 releases new "$RELEASE"
          npx --yes @sentry/cli@2.58.6 releases set-commits "$RELEASE" --auto --ignore-missing
          npx --yes @sentry/cli@2.58.6 releases finalize "$RELEASE"

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [build-app]
    if: github.event_name != 'pull_request'
    # Requires manual approval via the "production" environment (required reviewer).
    environment: production
    steps:
      - name: Trigger deploy
        run: |
          if [ -n "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}" ]; then
            curl -sSf -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}"
          fi

      # Marca la release como desplegada a producción. Es lo que puebla el
      # "deployed X ago" de la UI de Sentry y lo que da fecha a un
      # «resolver en la próxima versión».
      - name: Mark the Sentry release as deployed
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: guillermoscript
          SENTRY_PROJECT: gym-guille
          RELEASE: ${{ needs.build-app.outputs.sentry-release }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN no configurado — se omite el marcador de deploy"
            exit 0
          fi
          npx --yes @sentry/cli@2.58.6 deploys new -e production -r "$RELEASE"
