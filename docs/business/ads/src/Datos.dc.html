<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*FONTS*/
    body { margin: 0; }
    a { color: #C6F42F; } a:hover { color: #d8f766; }
    .bebas { font-family: 'Bebas Neue', 'Haettenschweiler', 'Impact', sans-serif; font-weight: 400; }
    .sans { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace; font-weight: 600; }
  </style>
</helmet>
<div style="position: relative; box-sizing: border-box; width: 1080px; height: 1080px; background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 76px 76px 72px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="logo.png" alt="" style="width: 48px; height: 48px; object-fit: contain;">
      <span class="bebas" style="font-size: 38px; line-height: 1; letter-spacing: 2px; color: #fafafa;">CALISTENIA</span>
    </div>
    <span class="mono" style="font-size: 20px; letter-spacing: 4px; color: #a3a3a3;">FUNCIONA EN EL NAVEGADOR</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 32px;">
    <div style="width: 140px; height: 9px; background: {{accent}};"></div>
    <h1 class="bebas" style="margin: 0; font-size: 124px; line-height: 0.84; letter-spacing: -1px; color: #fafafa;">
      NO GASTES DATOS<br><span style="color: {{accent}}">INSTALANDO NADA.</span>
    </h1>
    <p class="sans" style="margin: 0; max-width: 820px; font-size: 32px; line-height: 1.45; color: rgba(250,250,250,0.68);">
      Se abre en el navegador y pesa menos que una foto. La añades a la pantalla de inicio y ya la tienes como app.
    </p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; align-items: center; gap: 20px; background: #121212; border: 2px solid #262626; border-radius: 999px; padding: 26px 34px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C6F42F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
      <span class="sans" style="font-size: 34px; font-weight: 700; color: #fafafa;">gym.guille.tech</span>
      <span style="flex-grow: 1;"></span>
      <span class="mono" style="font-size: 19px; letter-spacing: 2px; color: #121212; background: {{accent}}; border-radius: 999px; padding: 12px 22px;">AÑADIR A INICIO</span>
    </div>
    <span class="sans" style="font-size: 25px; color: rgba(250,250,250,0.45);">Gratis en acceso anticipado. Sin tarjeta. También en Android.</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F42F","options":["#C6F42F","#8FB80A","#fafafa","#ff5a1f"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C6F42F' };
  }
}
</script>
</body>
</html>
